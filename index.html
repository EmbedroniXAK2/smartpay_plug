<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPay App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}

body{
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:#e2e8f0;
}

/* LOGIN */
.login-page{
  position:fixed;width:100%;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
}

.login-box{
  width:350px;padding:30px;border-radius:20px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  text-align:center;
}

.login-input{
  width:100%;padding:12px;margin:10px 0;
  border-radius:10px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.08);color:white;
}

.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;cursor:pointer;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.menu{display:none}

/* MOBILE MENU */
.menu-btn{
  display:none;
  font-size:22px;
  cursor:pointer;
}

/* PROFILE FOOTER */
.profile-footer{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#22c55e;
  display:flex;
  align-items:center;
  justify-content:center;
  color:black;
  font-weight:bold;
}

/* APP */
.app{display:none;height:100vh}

.main{flex:1;padding:25px}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:20px;border-radius:15px;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(59,130,246,0.2);
  text-align:center;
}

.pay-btn{
  padding:12px;width:100%;border:none;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#22c55e);
  color:white;cursor:pointer;
}

.page{display:none}
.page.active{display:block}

@media(max-width:768px){
  .sidebar{display:none}
  .menu{display:block}
  .menu-btn{display:block}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h2>⚡ SmartPay</h2>

    <input id="email" type="email" placeholder="Enter Email" class="login-input">
    <input id="password" type="password" placeholder="Enter Password" class="login-input">

    <button onclick="loginWithEmail()" class="login-btn">Login</button>
  </div>
</div>

<!-- APP -->
<div class="app">

<!-- ☰ MENU BUTTON -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="sidebar">

  <div>
    <h2 style="color:#60a5fa;">⚡ SmartPay</h2>

    <button class="nav-btn" onclick="showPage('dashboard',this)">Dashboard</button>
    <button class="nav-btn" onclick="showPage('payment',this)">Payment</button>
    <button class="nav-btn" onclick="showPage('qr',this)">QR</button>
    <button class="nav-btn" onclick="showPage('history',this)">History</button>
  </div>

  <!-- 👤 PROFILE FOOTER -->
  <div class="profile-footer" onclick="showPage('profile')">
    <div class="avatar" id="avatarLetter">U</div>
    <div>
      <div style="font-size:14px;">Profile</div>
    </div>
  </div>

</div>

<div class="main">

<div id="dashboard" class="page active">
  <h2>Dashboard</h2>
  <p id="userInfo"></p>
</div>

<div id="payment" class="page">
  <h2>Make a Payment</h2>
  <div class="cards">
    <div class="card"><h3>₹10</h3><button class="pay-btn" onclick="pay(10)">Pay</button></div>
    <div class="card"><h3>₹25</h3><button class="pay-btn" onclick="pay(25)">Pay</button></div>
    <div class="card"><h3>₹50</h3><button class="pay-btn" onclick="pay(50)">Pay</button></div>
  </div>
</div>

<div id="qr" class="page"><h2>QR</h2></div>

<div id="history" class="page">
  <h2>History</h2>
  <div id="historyList"></div>
</div>

<div id="profile" class="page">
  <h2>User Profile</h2>

  <p>Name: <span id="nameDisplay"></span></p>
  <p>Phone: <span id="phoneDisplay"></span></p>
  <p>Email: <span id="emailDisplayText"></span></p>

  <button onclick="enableEdit()" class="login-btn">Edit</button>

  <div id="editSection" style="display:none;">
    <input id="nameInput" class="login-input">
    <input id="phoneInput" class="login-input">
    <button onclick="saveProfile()" class="login-btn">Save Changes</button>
  </div>

  <button onclick="logout()" class="login-btn" style="background:red;">Logout</button>
</div>

</div>
</div>

<script>
function toggleMenu(){
  const sidebar=document.getElementById("sidebar");
  sidebar.style.display = sidebar.style.display==="block"?"none":"block";
}

function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

function enableEdit(){
  document.getElementById("editSection").style.display="block";
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCn074Y2qun8KPMpmtzOZaUrJTe2CMAHP8",
  authDomain:"smartpayplug.firebaseapp.com",
  projectId:"smartpayplug"
});

const auth=getAuth(app);
const db=getFirestore(app);

window.loginWithEmail=async()=>{
  const emailValue=email.value;
  const passwordValue=password.value;

  try{
    await signInWithEmailAndPassword(auth,emailValue,passwordValue);
  }catch{
    await createUserWithEmailAndPassword(auth,emailValue,passwordValue);
  }
};

window.saveProfile=async()=>{
  const user=auth.currentUser;

  await setDoc(doc(db,"users",user.uid),{
    name:nameInput.value,
    phone:phoneInput.value,
    email:user.email
  });

  // 🔥 UPDATE UI INSTANTLY
  nameDisplay.innerText=nameInput.value;
  phoneDisplay.innerText=phoneInput.value;

  document.getElementById("editSection").style.display="none";

  // avatar letter update
  avatarLetter.innerText=nameInput.value.charAt(0).toUpperCase();
};

async function loadProfile(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
    const d=snap.data();
    nameDisplay.innerText=d.name||"-";
    phoneDisplay.innerText=d.phone||"-";
    nameInput.value=d.name||"";
    phoneInput.value=d.phone||"";

    avatarLetter.innerText=(d.name||"U").charAt(0).toUpperCase();
  }
  emailDisplayText.innerText=user.email;
}

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
  if(user){
    document.querySelector(".app").style.display="flex";
    loginPage.style.display="none";
    userInfo.innerText=user.email;
    loadProfile(user);
  }
});
</script>

</body>
</html>
