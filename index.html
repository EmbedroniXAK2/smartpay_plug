<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPay App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}

body{
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:#e2e8f0;
}

/* LOGIN */
.login-page{
  position:fixed;width:100%;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
}

.login-box{
  width:350px;padding:30px;border-radius:20px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  text-align:center;
}

.login-box h2{color:#60a5fa;margin-bottom:20px}

.login-input{
  width:100%;padding:12px;margin:10px 0;
  border-radius:10px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.08);color:white;
}

.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;cursor:pointer;
}

/* GOOGLE BUTTON */
.google-btn{
  width:100%;padding:12px;margin-top:10px;border:none;
  border-radius:10px;display:flex;align-items:center;
  justify-content:center;gap:10px;
  background:white;color:#1f2937;font-weight:500;
}

.google-icon{width:20px;height:20px}

.divider{margin:15px 0;color:#94a3b8}

/* APP */
.app{display:none;height:100vh}

.sidebar{
  width:250px;background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.logo{font-size:22px;color:#60a5fa;margin-bottom:30px}

.nav-btn{
  width:100%;padding:12px;margin-bottom:10px;border:none;
  border-radius:10px;background:transparent;
  color:#94a3b8;cursor:pointer;
}

.nav-btn:hover,.nav-btn.active{
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;
}

.main{flex:1;padding:25px}

.header{
  display:flex;justify-content:space-between;
  padding:15px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  margin-bottom:20px;
}

.badge{
  background:#22c55e;padding:5px 12px;
  border-radius:20px;color:black;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:20px;border-radius:15px;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(59,130,246,0.2);
  text-align:center;
}

.pay-btn{
  padding:12px;width:100%;border:none;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#22c55e);
  color:white;cursor:pointer;
}

.pay-btn:hover{transform:scale(1.02)}

.qr{
  width:140px;margin-top:10px;
  background:white;padding:8px;border-radius:10px;
}

.page{display:none}
.page.active{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h2>⚡ SmartPay</h2>

    <input type="email" placeholder="Enter Email" class="login-input">
    <input type="password" placeholder="Enter Password" class="login-input">

    <button onclick="loginWithEmail()" class="login-btn">Login</button>

    <div class="divider">OR</div>

    <button onclick="loginWithGoogle()" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon">
      Continue with Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app">

<div class="sidebar">
  <div class="logo">⚡ SmartPay</div>
  <button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button>
  <button class="nav-btn" onclick="showPage('qr',this)">QR</button>
  <button class="nav-btn" onclick="showPage('payment',this)">Payment</button>
  <button class="nav-btn" onclick="showPage('session',this)">Session</button>
  <button class="nav-btn" onclick="showPage('profile',this)">Profile</button>
</div>

<div class="main">

<div class="header">
  <h2>Control Panel</h2>
  <span class="badge">LIVE</span>
</div>

<div id="dashboard" class="page active">
  <h1>⚡ SmartPay Dashboard</h1>
  <p id="userInfo"></p>
</div>

<!-- 🔥 PROFESSIONAL PROFILE -->
<div id="profile" class="page">
  <h2 style="margin-bottom:20px;">User Profile</h2>

  <div style="max-width:600px;background:rgba(255,255,255,0.04);
  padding:25px;border-radius:15px;border:1px solid rgba(255,255,255,0.1);">

    <label style="font-size:13px;color:#94a3b8;">Full Name</label>
    <input id="nameInput" class="login-input">

    <label style="font-size:13px;color:#94a3b8;">Phone Number</label>
    <input id="phoneInput" class="login-input">

    <label style="font-size:13px;color:#94a3b8;">Email Address</label>
    <input id="emailDisplay" class="login-input" disabled>

    <label style="font-size:13px;color:#94a3b8;">Location</label>
    <input id="locationInput" class="login-input">

    <label style="font-size:13px;color:#94a3b8;">Account Type</label>
    <input class="login-input" value="Standard User" disabled>

    <button class="login-btn" onclick="saveProfile()" style="margin-top:10px;">
      Save Changes
    </button>

    <button class="login-btn" onclick="logout()" 
    style="margin-top:10px;background:#ef4444;">
      Logout
    </button>
  </div>
</div>

<!-- QR -->
<div id="qr" class="page">
  <h2>Scan & Pay</h2><br>
  <div class="cards">
    <div class="card"><h3>₹10</h3><a href="https://rzp.io/rzp/9ixGnnK" target="_blank"><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://rzp.io/rzp/9ixGnnK"></a></div>
    <div class="card"><h3>₹25</h3><a href="https://rzp.io/rzp/pqDtb3dH" target="_blank"><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://rzp.io/rzp/pqDtb3dH"></a></div>
    <div class="card"><h3>₹50</h3><a href="https://rzp.io/rzp/mKBH5wy" target="_blank"><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://rzp.io/rzp/mKBH5wy"></a></div>
  </div>
</div>

<!-- PAYMENT -->
<div id="payment" class="page">
  <h2>Pay Now</h2><br>
  <div class="cards">
    <div class="card"><h3>₹10</h3><button class="pay-btn" onclick="pay(10)">Pay</button></div>
    <div class="card"><h3>₹25</h3><button class="pay-btn" onclick="pay(25)">Pay</button></div>
    <div class="card"><h3>₹50</h3><button class="pay-btn" onclick="pay(50)">Pay</button></div>
  </div>
</div>

<div id="session" class="page"><h2>Session Active</h2></div>

</div>
</div>

<script>
function showPage(page,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function pay(amount){
  let url="";
  if(amount==10) url="https://rzp.io/rzp/9ixGnnK";
  if(amount==25) url="https://rzp.io/rzp/pqDtb3dH";
  if(amount==50) url="https://rzp.io/rzp/mKBH5wy";
  window.open(url,"_blank");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn074Y2qun8KPMpmtzOZaUrJTe2CMAHP8",
  authDomain: "smartpayplug.firebaseapp.com",
  projectId: "smartpayplug",
  storageBucket: "smartpayplug.firebasestorage.app",
  messagingSenderId: "4206063973",
  appId: "1:4206063973:web:198f4ce9b0afbf1955318c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.logout = async ()=>{ await signOut(auth); };

window.saveProfile = async ()=>{
  const user = auth.currentUser;
  await setDoc(doc(db,"users",user.uid),{
    name:document.getElementById("nameInput").value,
    phone:document.getElementById("phoneInput").value,
    location:document.getElementById("locationInput").value,
    email:user.email,
    updatedAt:serverTimestamp()
  },{merge:true});
  alert("Profile updated");
};

async function loadProfile(user){
  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
    const d=snap.data();
    document.getElementById("nameInput").value=d.name||"";
    document.getElementById("phoneInput").value=d.phone||"";
    document.getElementById("locationInput").value=d.location||"";
  }
  document.getElementById("emailDisplay").value=user.email;
}

window.loginWithGoogle = async ()=>{
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth,provider);
};

window.loginWithEmail = async ()=>{
  const email=document.querySelectorAll(".login-input")[0].value;
  const password=document.querySelectorAll(".login-input")[1].value;

  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(error){
    if(error.code === "auth/user-not-found"){
      await createUserWithEmailAndPassword(auth,email,password);
    }else{
      alert(error.message);
    }
  }
};

onAuthStateChanged(auth,(user)=>{
  const login=document.getElementById("loginPage");
  const appDiv=document.querySelector(".app");
  if(user){
    login.style.display="none";
    appDiv.style.display="flex";
    document.getElementById("userInfo").innerText="Logged in: "+user.email;
    loadProfile(user);
  }else{
    login.style.display="flex";
    appDiv.style.display="none";
  }
});
</script>

</body>
</html>
