<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPay App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}

body{
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:#e2e8f0;
}

/* LOGIN */
.login-page{
  position:fixed;width:100%;height:100vh;
  display:flex;justify-content:center;align-items:center;
}

.login-box{
  width:350px;padding:30px;border-radius:20px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  text-align:center;
}

.login-input{
  width:100%;padding:12px;margin:10px 0;
  border-radius:10px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.08);color:white;
}

.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;cursor:pointer;
}

.google-btn{
  width:100%;padding:12px;margin-top:10px;
  border:none;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  gap:10px;background:white;color:black;font-weight:500;
  cursor:pointer;
}

.google-btn img{width:20px}

/* APP */
.app{display:none;height:100vh;display:flex}

.sidebar{
  width:250px;
  background:rgba(255,255,255,0.05);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.logo{font-size:22px;color:#60a5fa;margin-bottom:30px}

.nav-btn{
  width:100%;padding:12px;margin-bottom:10px;
  border:none;border-radius:10px;background:transparent;
  color:#94a3b8;cursor:pointer;
}

.nav-btn.active,.nav-btn:hover{
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;
}

.main{flex:1;padding:25px}

.header{
  padding:15px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  margin-bottom:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:20px;border-radius:15px;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(59,130,246,0.2);
  text-align:center;
}

.pay-btn{
  padding:12px;width:100%;
  border:none;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#22c55e);
  color:white;
}

.page{display:none}
.page.active{display:block}

.qr{
  width:140px;background:white;padding:8px;border-radius:10px;
}

/* PROFILE BOXES */
.profile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  max-width:600px;
}

.profile-box{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h2>⚡ SmartPay</h2>

    <input id="email" class="login-input" placeholder="Email">
    <input id="password" type="password" class="login-input" placeholder="Password">

    <button onclick="loginWithEmail()" class="login-btn">Login</button>

    <button onclick="loginWithGoogle()" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Sign in with Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app">

<div class="sidebar">
  <div class="logo">⚡ SmartPay</div>

  <button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button>
  <button class="nav-btn" onclick="showPage('payment',this)">Payment</button>
  <button class="nav-btn" onclick="showPage('qr',this)">QR</button>
  <button class="nav-btn" onclick="showPage('history',this)">History</button>
  <button class="nav-btn" onclick="showPage('profile',this)">Profile</button>
</div>

<div class="main">

<div class="header"><h2>Control Panel</h2></div>

<div id="dashboard" class="page active">
  <h2>Dashboard</h2>
  <p id="userInfo"></p>
</div>

<div id="payment" class="page">
  <h2>Make a Payment</h2>
  <div class="cards">
    <div class="card"><h3>₹10</h3><button class="pay-btn" onclick="pay(10)">Pay</button></div>
    <div class="card"><h3>₹25</h3><button class="pay-btn" onclick="pay(25)">Pay</button></div>
    <div class="card"><h3>₹50</h3><button class="pay-btn" onclick="pay(50)">Pay</button></div>
  </div>
</div>

<div id="qr" class="page">
  <h2>Scan & Pay</h2>
</div>

<div id="history" class="page">
  <h2>Payment History</h2>
  <div id="historyList"></div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h2>User Profile</h2>

  <div class="profile-grid">
    <div class="profile-box"><small>Name</small><br><b id="nameDisplay"></b></div>
    <div class="profile-box"><small>Phone</small><br><b id="phoneDisplay"></b></div>
    <div class="profile-box"><small>Email</small><br><b id="emailDisplayText"></b></div>
  </div>

  <br>

  <button onclick="enableEdit()" class="login-btn">Edit</button>

  <div id="editSection" style="display:none;">
    <input id="nameInput" class="login-input">
    <input id="phoneInput" class="login-input">
    <button onclick="saveProfile()" class="login-btn">Save Changes</button>
  </div>

  <button onclick="logout()" class="login-btn" style="background:red;">Logout</button>
</div>

</div>
</div>

<script>
function showPage(page,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function enableEdit(){
  document.getElementById("editSection").style.display="block";
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCn074Y2qun8KPMpmtzOZaUrJTe2CMAHP8",
  authDomain:"smartpayplug.firebaseapp.com",
  projectId:"smartpayplug"
});

const auth=getAuth(app);
const db=getFirestore(app);

/* GOOGLE LOGIN */
window.loginWithGoogle=async()=>{
  const provider=new GoogleAuthProvider();
  await signInWithPopup(auth,provider);
};

/* EMAIL LOGIN */
window.loginWithEmail=async()=>{
  const emailValue=email.value;
  const passwordValue=password.value;

  try{
    await signInWithEmailAndPassword(auth,emailValue,passwordValue);
  }catch{
    await createUserWithEmailAndPassword(auth,emailValue,passwordValue);
  }
};

window.saveProfile=async()=>{
  const user=auth.currentUser;

  await setDoc(doc(db,"users",user.uid),{
    name:nameInput.value,
    phone:phoneInput.value,
    email:user.email
  });

  nameDisplay.innerText=nameInput.value;
  phoneDisplay.innerText=phoneInput.value;

  editSection.style.display="none";
};

window.pay=function(amount){
  savePayment(amount);
  window.location.href="https://rzp.io/rzp/9ixGnnK";
};

window.savePayment=async(amount)=>{
  const user=auth.currentUser;
  await addDoc(collection(db,"users",user.uid,"payments"),{
    amount,time:new Date().toLocaleString()
  });
};

onAuthStateChanged(auth,(user)=>{
  if(user){
    document.querySelector(".app").style.display="flex";
    loginPage.style.display="none";
    userInfo.innerText=user.email;
    emailDisplayText.innerText=user.email;
  }
});

window.logout=()=>signOut(auth);
</script>

</body>
</html>
