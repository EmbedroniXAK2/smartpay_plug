<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPay App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}

body{
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:#e2e8f0;
}

/* LOGIN */
.login-page{
  position:fixed;width:100%;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
}

.login-box{
  width:350px;padding:30px;border-radius:20px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  text-align:center;
}

.login-input{
  width:100%;padding:12px;margin:10px 0;
  border-radius:10px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.08);color:white;
}

.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;cursor:pointer;
}

.google-btn{
  width:100%;padding:12px;margin-top:10px;border:none;
  border-radius:10px;display:flex;align-items:center;
  justify-content:center;gap:10px;
  background:white;color:#1f2937;font-weight:500;
}

.google-icon{width:20px}
.divider{margin:15px 0;color:#94a3b8}

/* APP */
.app{display:none;height:100vh}

.sidebar{
  width:250px;background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
}

.logo{font-size:22px;color:#60a5fa;margin-bottom:30px}

.nav-btn{
  width:100%;padding:12px;margin-bottom:10px;border:none;
  border-radius:10px;background:transparent;
  color:#94a3b8;cursor:pointer;
}

.nav-btn:hover,.nav-btn.active{
  background:linear-gradient(135deg,#2563eb,#22c55e);
  color:white;
}

.main{flex:1;padding:25px}

.header{
  padding:15px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  margin-bottom:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:20px;border-radius:15px;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(59,130,246,0.2);
  text-align:center;
}

.pay-btn{
  padding:12px;width:100%;border:none;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#22c55e);
  color:white;cursor:pointer;
}

.page{display:none}
.page.active{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <h2>⚡ SmartPay</h2>

    <input id="email" type="email" placeholder="Enter Email" class="login-input">
    <input id="password" type="password" placeholder="Enter Password" class="login-input">

    <button onclick="loginWithEmail()" class="login-btn">Login</button>

    <div class="divider">OR</div>

    <button onclick="loginWithGoogle()" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon">
      Continue with Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app">

<div class="sidebar">
  <div class="logo">⚡ SmartPay</div>
  <button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button>
  <button class="nav-btn" onclick="showPage('payment',this)">Payment</button>
  <button class="nav-btn" onclick="showPage('history',this)">History</button>
  <button class="nav-btn" onclick="showPage('profile',this)">Profile</button>
</div>

<div class="main">

<div class="header">
  <h2>Control Panel</h2>
</div>

<div id="dashboard" class="page active">
  <h2>Dashboard</h2>
  <p id="userInfo"></p>
</div>

<!-- PAYMENT -->
<div id="payment" class="page">
  <h2>Make a Payment</h2>
  <div class="cards">
    <div class="card"><h3>₹10</h3><button class="pay-btn" onclick="pay(10)">Pay ₹10</button></div>
    <div class="card"><h3>₹25</h3><button class="pay-btn" onclick="pay(25)">Pay ₹25</button></div>
    <div class="card"><h3>₹50</h3><button class="pay-btn" onclick="pay(50)">Pay ₹50</button></div>
  </div>
</div>

<!-- HISTORY -->
<div id="history" class="page">
  <h2>Payment History</h2>
  <div id="historyList"></div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h2>User Profile</h2>
  <input id="nameInput" class="login-input" placeholder="Name">
  <input id="phoneInput" class="login-input" placeholder="Phone">
  <input id="locationInput" class="login-input" placeholder="Location">
  <input id="emailDisplay" class="login-input" disabled>
  <button class="login-btn" onclick="saveProfile()">Save</button>
  <button class="login-btn" onclick="logout()" style="margin-top:10px;background:red;">Logout</button>
</div>

</div>
</div>

<script>
function showPage(page,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function pay(amount){
  savePayment(amount);
  if(amount==10) window.open("https://rzp.io/rzp/9ixGnnK");
  if(amount==25) window.open("https://rzp.io/rzp/pqDtb3dH");
  if(amount==50) window.open("https://rzp.io/rzp/mKBH5wy");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn074Y2qun8KPMpmtzOZaUrJTe2CMAHP8",
  authDomain: "smartpayplug.firebaseapp.com",
  projectId: "smartpayplug",
  storageBucket: "smartpayplug.firebasestorage.app",
  messagingSenderId: "4206063973",
  appId: "1:4206063973:web:198f4ce9b0afbf1955318c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.loginWithGoogle = async ()=>{
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth,provider);
};

window.loginWithEmail = async ()=>{
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(error){
    if(error.code === "auth/user-not-found"){
      await createUserWithEmailAndPassword(auth,email,password);
    }else{
      alert(error.message);
    }
  }
};

window.logout = ()=>signOut(auth);

window.saveProfile = async ()=>{
  const user = auth.currentUser;
  await setDoc(doc(db,"users",user.uid),{
    name:nameInput.value,
    phone:phoneInput.value,
    location:locationInput.value,
    email:user.email
  });
};

window.savePayment = async (amount)=>{
  const user = auth.currentUser;
  await addDoc(collection(db,"users",user.uid,"payments"),{
    amount,
    time:new Date().toLocaleString()
  });
};

async function loadHistory(user){
  const snap = await getDocs(collection(db,"users",user.uid,"payments"));
  historyList.innerHTML="";
  snap.forEach(doc=>{
    const d=doc.data();
    historyList.innerHTML += `<p>₹${d.amount} - ${d.time}</p>`;
  });
}

onAuthStateChanged(auth,(user)=>{
  if(user){
    document.querySelector(".app").style.display="flex";
    loginPage.style.display="none";
    userInfo.innerText=user.email;
    loadHistory(user);
  }
});
</script>

</body>
</html>
